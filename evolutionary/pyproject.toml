[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-gate-passing"
version = "0.1.0"
description = "Evolutionary Hebbian flocking controllers trained to navigate gradient-mapped paths"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "cma>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
